<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ne Kadardı? · Fiyat tahmin oyunu</title>
  <meta name="description" content="Geçmiş yıllarda benzin, altın, ekmek ne kadardı? Tahmin et, gerçek fiyatla karşılaştır.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧾</text></svg>">
  <meta property="og:title" content="Ne Kadardı? · Fiyat tahmin oyunu">
  <meta property="og:description" content="Geçmiş yıllarda fiyatlar ne kadardı? Tahmin et, gerçek fiyatla karşılaştır ve enflasyonu gör.">
  <meta property="og:image" content="https://murtibad.github.io/ne-kadardi/social.jpg">
  <meta property="og:image:width" content="1376">
  <meta property="og:image:height" content="768">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <header class="site-header">
    <h1 class="logo">Ne Kadardı?</h1>
    <a href="#zaman-makinesi" class="header-link">Zaman makinesi</a>
  </header>

  <main>
    <section id="message-screen">
      <div class="receipt-card">
        <p id="message-text">Yükleniyor…</p>
      </div>
    </section>

    <section id="question-screen" hidden>
      <div class="receipt-card question-card">
        <div class="period-badge"><span id="q-period"></span></div>
        <img id="q-image" class="product-image" width="72" height="72" alt="" decoding="async" hidden>
        <h2 id="q-name" class="product"></h2>
        <p id="q-unit" class="unit"></p>
        
        <form id="guess-form" novalidate>
          <label for="guess-input" class="visually-hidden">Tahminin (TL)</label>
          <div class="guess-field">
            <input id="guess-input" type="text" inputmode="decimal" autocomplete="off"
                   placeholder="Tahminin" aria-describedby="guess-error">
            <span class="currency">₺</span>
          </div>
          <p id="guess-error" class="error" role="alert"></p>
          <button type="submit" class="btn primary">Tahmin et</button>
        </form>
      </div>
    </section>

    <section id="result-screen" hidden>
      <div class="receipt-wrapper">
        <article class="receipt-card result-receipt" aria-live="polite">
          <p class="receipt-head">*** NE KADARDI? ***</p>
          <p id="r-title" class="receipt-title"></p>
          <p id="r-unit" class="receipt-unit"></p>
          <hr>
          <dl>
            <div class="row"><dt>Tahminin</dt><dd id="r-guess"></dd></div>
            <div class="row"><dt>Gerçek Fiyat</dt><dd id="r-actual" class="highlight-price"></dd></div>
          </dl>
          <div class="verdict-box">
            <p id="r-verdict" class="verdict"></p>
          </div>
          <hr>
          <dl id="r-current-row">
            <div class="row"><dt id="r-current-label">Güncel</dt><dd id="r-current"></dd></div>
            <div class="row"><dt>Artış</dt><dd id="r-increase"></dd></div>
          </dl>
          <div class="score-box">
            <p class="score">PUAN <span id="r-score"></span></p>
          </div>
          <p id="r-context" class="context-line"></p>
          <p class="source">Kaynak: <a id="r-source" target="_blank" rel="noopener"></a></p>
        </article>
      </div>
      
      <div class="session-actions">
        <p id="r-session" class="session"></p>
        <div class="actions">
          <button id="share-btn" type="button" class="btn">Paylaş</button>
          <button id="next-btn" type="button" class="btn primary">Sonraki</button>
        </div>
      </div>
    </section>

    <section id="timeline-screen" hidden>
      <div class="timeline-header">
        <h2>Zaman makinesi</h2>
        <p>Doğrulanmış tüm fiyatlar, kaynaklarıyla.</p>
        <a href="#" class="btn primary timeline-back-btn">Oyuna dön</a>
      </div>
      
      <div class="timeline-picker" role="group" aria-label="Ürün seç" id="timeline-picker">
      </div>
      
      <div class="receipt-wrapper">
        <article class="receipt-card result-receipt timeline-receipt">
          <p id="t-title" class="receipt-title"></p>
          <p id="t-unit" class="receipt-unit"></p>
          <hr>
          <div id="t-rows-container"></div>
        </article>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>Tüm fiyatlar kaynaklıdır. Hata görürsen
      <a href="https://github.com/murtibad/ne-kadardi/issues" target="_blank" rel="noopener">bildir</a>.</p>
    <p><a href="#zaman-makinesi" class="footer-link">Zaman makinesi</a></p>
  </footer>
</body>
</html>
